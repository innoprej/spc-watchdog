[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "spc-watchdog"
version = "0.1.0"
description = "An autonomous quality engineer for simulated manufacturing lines."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139,<0.140",
  "mcp>=1.28,<2",
  "numpy==2.5.1",
  "uvicorn[standard]>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
